{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff login · PureCure</title><link rel="stylesheet" href="{% static 'purecure/css/style.css' %}"></head><body class="login-page"><section class="login-card"><div class="login-brand"><b>+</b> PureCure</div><h1>Staff sign in</h1><p>Use your employee username and password to continue.</p>{% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}<form method="post">{% csrf_token %}<label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form></section></body></html>
